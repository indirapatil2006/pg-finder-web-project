<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PG Finder — Login / Register</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <input id="themeToggle" class="theme-toggle-input" type="checkbox" aria-label="Toggle color theme">

  <div class="app">

  <header class="topbar">
    <div class="brand">PG Finder</div>
    <nav class="top-actions">
      <button class="btn btn-outline-yellow" onclick="location.href='home.html'">Explore</button>
      <label for="themeToggle" class="theme-switch" title="Toggle theme" aria-hidden="false">
        <span class="moon">🌙</span>
        <span class="sun">☀️</span>
        <span class="switch-knob"></span>
      </label>
    </nav>
  </header>

  <main class="center-wrap">
  <section class="login-card" aria-labelledby="loginTitle">
    <h1 id="loginTitle">Welcome</h1>
    <p class="lead">Find or list paying-guest homes easily.</p>

    <label class="label">You are</label>
    <div class="segmented" role="radiogroup" aria-label="Choose role">
      <label class="seg" for="r-tenant"><input id="r-tenant" name="roleRadio" type="radio" value="tenant" checked onchange="document.getElementById('role').value='tenant'"> <span class="dot"></span> Tenant</label>
      <label class="seg" for="r-owner"><input id="r-owner" name="roleRadio" type="radio" value="owner" onchange="document.getElementById('role').value='owner'"> <span class="dot"></span> Owner</label>
    </div>
    <select id="role" hidden>
      <option value="tenant">Tenant</option>
      <option value="owner">Owner</option>
    </select>

    <label class="label" for="email">Email</label>
    <input type="email" id="email" placeholder="you@example.com" autocomplete="email">

    <label class="label" for="password">Password</label>
    <div class="password-wrap">
      <input type="password" id="password" placeholder="Enter password" autocomplete="current-password">
      <button class="icon-btn" id="togglePwd" type="button" aria-label="Show password" aria-pressed="false" onclick="togglePassword()">👁️</button>
    </div>

    <div class="actions-row">
      <button class="btn btn-yellow" onclick="login()">Login</button>
      <button class="btn btn-outline-yellow" onclick="registerUser()">Register</button>
    </div>

    <div class="meta-row">
      <button class="btn btn-ghost" onclick="resetData()">Reset Data</button>
      <small id="storageStatus" class="status">Users: 0 · Logged: -</small>
    </div>

    <div class="users-list" id="usersList" aria-live="polite"></div>

    <p class="tip">Tip: register as owner to access owner dashboard.</p>
  </section>
  </main>

  </div><!-- /.app -->

 <script>
function tenantClicked(){
 const roleSelect = document.getElementById("role");
 const tenantRadio = document.getElementById("r-tenant");
 if(roleSelect && tenantRadio) {
   roleSelect.value = tenantRadio.checked ? "tenant" : "owner";
 }
}

function resetData(){
 localStorage.clear();
 const status = document.getElementById("storageStatus");
 if(status) {
   status.textContent = "Users: 0 · Logged: -";
 }
 const usersList = document.getElementById("usersList");
 if(usersList) {
   usersList.innerHTML = "";
 }
 alert("Data reset successfully.");
}

function registerUser(){
 const role = document.getElementById("role").value;
 const email = document.getElementById("email").value.trim().toLowerCase();
 const password = document.getElementById("password").value;

 if(!email || !password){
   alert("Please fill all fields");
   return;
  }

 const users = JSON.parse(localStorage.getItem("users") || "{}");

 if(users[email]){
   alert("User already exists. Please login.");
   return;
 }

 users[email] = { password, role };
 localStorage.setItem("users", JSON.stringify(users));
 localStorage.setItem("pg_user", JSON.stringify({ email, role }));

 alert("Registered successfully!");

 if(role === "owner"){
   window.location.href = "owner.html";
 } else {
   window.location.href = "home.html";
  }
}

function login(){
 const roleSelected = document.getElementById("role").value;
 const email = document.getElementById("email").value.trim().toLowerCase();
 const password = document.getElementById("password").value;

 if(!email || !password){
   alert("Please fill all fields");
   return;
  }

 const users = JSON.parse(localStorage.getItem("users") || "{}");
 const user = users[email];

 if(!user || user.password !== password){
   alert("Invalid credentials");
   return;
 }

 const role = user.role || roleSelected;
 localStorage.setItem("pg_user", JSON.stringify({ email, role }));

 if(role === "owner"){
   window.location.href = "owner.html";
 } else {
   window.location.href = "home.html";
 }
}
</script>


<script src="script.js"></script>


</body>
</html>
